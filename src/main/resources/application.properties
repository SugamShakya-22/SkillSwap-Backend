spring.application.name=skillswap

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/skillswap
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server configuration - IMPORTANT: Bind to all network interfaces
server.address=0.0.0.0
server.port=8080

# FILE UPLOAD SIZE LIMITS (CRITICAL!)
# Maximum file size for a single file
spring.servlet.multipart.max-file-size=50MB
# Maximum request size (for multiple files)
spring.servlet.multipart.max-request-size=100MB

#pagination
spring.data.web.pageable.default-page-size=10

# SMTP settings (example for Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=karunadahal503@gmail.com
spring.mail.password=rzox nkiv cmqx avfu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

springdoc.swagger-ui.path=/docs

# ========================================
# ? WEBSOCKET & MESSAGING CONFIGURATION
# ========================================

# Enable WebSocket message logging for debugging
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.skillswap.skillswap=DEBUG

# WebSocket connection timeout (30 seconds)
spring.websocket.connection-timeout=30000

# ========================================
# ? CORS CONFIGURATION (CRITICAL!)
# ========================================

# Allow all origins for development (restrict in production!)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# ========================================
# ? STATIC RESOURCES (For serving uploaded files)
# ========================================

# Serve static files from uploads directory
spring.web.resources.static-locations=file:uploads/